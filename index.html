<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งเรื่องร้องเรียนออนไลน์</title>
    <!-- Tailwind CSS สำหรับตกแต่งหน้าเว็บให้สวยงามทันสมัย -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-p-4 flex items-center justify-center py-10">

    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6 md:p-8 m-4">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">📢 แจ้งเรื่องร้องเรียน</h1>
            <p class="text-sm text-slate-500 mt-1">แจ้งปัญหาในพื้นที่เพื่อให้เจ้าหน้าที่ตรวจสอบและแก้ไข</p>
        </div>

        <form id="complaintForm" class="space-y-4">
            <!-- หัวข้อเรื่อง -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">หัวข้อปัญหา / เรื่องที่ร้องเรียน *</label>
                <input type="text" id="title" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="เช่น ไฟฟ้าสาธารณะดับ ถนนชำรุด">
            </div>

            <!-- หมวดหมู่ -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">หมวดหมู่ปัญหา *</label>
                <select id="category" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                    <option value="">-- เลือกหมวดหมู่ --</option>
                    <option value="ถนนและทางเท้า">ถนนและทางเท้า</option>
                    <option value="ไฟฟ้าสาธารณะ">ไฟฟ้าสาธารณะ</option>
                    <option value="ขยะและสิ่งปฏิกูล">ขยะและสิ่งปฏิกูล</option>
                    <option value="ประปาและระบายน้ำ">ประปาและระบายน้ำ</option>
                    <option value="อื่น ๆ">อื่น ๆ</option>
                </select>
            </div>

            <!-- รายละเอียด -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รายละเอียดเพิ่มเติม</label>
                <textarea id="description" rows="3" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="ระบุจุดสังเกตหรือรายละเอียดเพิ่มเติม"></textarea>
            </div>

            <!-- พิกัด GPS -->
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <label class="block text-sm font-medium text-blue-900 mb-2">พิกัดจุดเกิดเหตุ (GPS) *</label>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="text" id="latitude" readonly placeholder="ละติจูด (Lat)" class="w-full px-3 py-1.5 text-sm bg-white border border-blue-200 rounded-lg">
                    <input type="text" id="longitude" readonly placeholder="ลองจิจูด (Lng)" class="w-full px-3 py-1.5 text-sm bg-white border border-blue-200 rounded-lg">
                </div>
                <button type="button" onclick="getLocation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                    📍 ดึงพิกัดตำแหน่งปัจจุบันของฉัน
                </button>
            </div>

            <!-- แนบรูปภาพ -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">แนบรูปภาพหลักฐาน</label>
                <input type="file" id="imageFile" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <!-- ข้อมูลผู้แจ้ง -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 border-t border-slate-100">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้แจ้ง</label>
                    <input type="text" id="reporterName" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="ชื่อ-นามสกุล">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">เบอร์โทรศัพท์ติดต่อ</label>
                    <input type="tel" id="reporterPhone" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="0812345678">
                </div>
            </div>

            <!-- ปุ่มส่งข้อมูล -->
            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl shadow-lg transition duration-200 mt-4">
                🚀 ส่งเรื่องร้องเรียน
            </button>
        </form>
    </div>

    <!-- Script สำหรับเชื่อมต่อ Supabase และจัดการการทำงาน -->
    <script>
        // === ตั้งค่าการเชื่อมต่อ Supabase ของคุณที่นี่ ===
        const SUPABASE_URL = 'https://idgojpyhowjjphhanljt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3gL-lEkHS1u6j34kL8nufQ_gHl8YFs2';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ฟังก์ชันดึงพิกัด GPS
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('latitude').value = position.coords.latitude;
                        document.getElementById('longitude').value = position.coords.longitude;
                        alert('ดึงพิกัดสำเร็จ!');
                    },
                    (error) => {
                        alert('ไม่สามารถดึงพิกัดได้: กรุณาอนุญาตให้เข้าถึงตำแหน่งที่ตั้ง');
                    }
                );
            } else {
                alert('เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง GPS');
            }
        }

        // จัดการเมื่อกดส่งฟอร์ม
        document.getElementById('complaintForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const lat = document.getElementById('latitude').value;
            const lng = document.getElementById('longitude').value;

            if (!lat || !lng) {
                alert('กรุณากดปุ่ม "ดึงพิกัดตำแหน่งปัจจุบันของฉัน" ก่อนส่งเรื่อง');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังส่งข้อมูล...';

            try {
                let imageUrl = null;
                const fileInput = document.getElementById('imageFile');

                // 1. ถ้ามีการแนบรูป ให้ทำการอัปโหลดไปที่ Supabase Storage (Bucket: complaint-images)
// 1. ถ้ามีการแนบรูป ให้ทำการอัปโหลดไปที่ Supabase Storage (Bucket: complaint-images)
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`;
                    const filePath = `${fileName}`;

                    const { error: uploadError } = await _supabase.storage
                        .from('complaint-images')
                        .upload(filePath, file);

                    if (uploadError) throw uploadError;

                    // ดึง Public URL ของรูปภาพ
                    const { data: publicURLData } = _supabase.storage
                        .from('complaint-images')
                        .getPublicUrl(filePath);

                    imageUrl = publicURLData.publicUrl;
                }
                // 2. บันทึกข้อมูลลงตาราง complaints
                const { error: insertError } = await _supabase
                    .from('complaints')
                    .insert([
                        {
                            title: document.getElementById('title').value,
                            category: document.getElementById('category').value,
                            description: document.getElementById('description').value,
                            latitude: parseFloat(lat),
                            longitude: parseFloat(lng),
                            image_url: imageUrl,
                            reporter_name: document.getElementById('reporterName').value,
                            reporter_phone: document.getElementById('reporterPhone').value,
                            status: 'pending'
                        }
                    ]);

                if (insertError) throw insertError;

                alert('ส่งเรื่องร้องเรียนสำเร็จเรียบร้อยแล้ว ขอบคุณครับ!');
                document.getElementById('complaintForm').reset();
                document.getElementById('latitude').value = '';
                document.getElementById('longitude').value = '';

            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการส่งข้อมูล: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 ส่งเรื่องร้องเรียน';
            }
        });
    </script>
</body>
</html>
