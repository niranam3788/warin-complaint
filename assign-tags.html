<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจ่ายงานและติด Tag กอง/ฝ่าย - เทศบาลเมืองวารินชำราบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- ส่วนหัวข้อ -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-800">🏷️ ระบบจ่ายงานและติด Tag กอง/ฝ่ายรับผิดชอบ</h1>
            <p class="text-sm text-slate-500 mt-0.5">เทศบาลเมืองวารินชำราบ จังหวัดอุบลราชธานี</p>
        </div>

        <!-- แถบกรองข้อมูล -->
        <div class="flex gap-2 p-1 bg-white rounded-xl shadow-sm border border-slate-200 w-fit">
            <button onclick="filterComplaints('all')" id="btn-all" class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-800 text-white transition">ทั้งหมด</button>
            <button onclick="filterComplaints('tagged')" id="btn-tagged" class="px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 transition">ติด Tag แล้ว</button>
            <button onclick="filterComplaints('untagged')" id="btn-untagged" class="px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 transition">ยังไม่ได้ติด Tag</button>
        </div>

        <!-- รายการคำร้อง -->
        <div id="complaintsList" class="space-y-4">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-400 text-sm">กำลังโหลด...</div>
        </div>
    </div>

    <!-- Modal สำหรับเลือก Tag -->
    <div id="tagModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800">เลือกกอง/ฝ่ายที่รับผิดชอบ</h3>
            <input type="hidden" id="currentComplaintId">
            <div class="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto" id="departmentCheckboxContainer"></div>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button onclick="closeTagModal()" class="px-4 py-2 text-sm bg-slate-200 rounded-xl">ยกเลิก</button>
                <button onclick="saveTags()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-xl">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://idgojpyhowjjphhanljt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3gL-lEkHS1u6j34kL8nufQ_gHl8YFs2';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let allData = []; // เก็บข้อมูลทั้งหมดไว้ในเครื่องเพื่อทำ Filter

        const DEPARTMENTS = [
            { name: 'สำนักปลัดเทศบาล', bg: 'bg-blue-100 text-blue-800 border-blue-200' },
            { name: 'กองคลัง', bg: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
            { name: 'กองยุทธศาสตร์ฯ', bg: 'bg-purple-100 text-purple-800 border-purple-200' },
            { name: 'กองสาธารณสุขฯ', bg: 'bg-amber-100 text-amber-800 border-amber-200' },
            { name: 'กองสวัสดิการสังคม', bg: 'bg-pink-100 text-pink-800 border-pink-200' },
            { name: 'กองการเจ้าหน้าที่', bg: 'bg-indigo-100 text-indigo-800 border-indigo-200' },
            { name: 'กองช่าง', bg: 'bg-orange-100 text-orange-800 border-orange-200' },
            { name: 'กองช่างสุขา', bg: 'bg-cyan-100 text-cyan-800 border-cyan-200' },
            { name: 'กองการศึกษา', bg: 'bg-rose-100 text-rose-800 border-rose-200' },
            { name: 'กลุ่มงานป้องกันฯ', bg: 'bg-red-100 text-red-800 border-red-200' },
            { name: 'งานนิตการ', bg: 'bg-teal-100 text-teal-800 border-teal-200' },
            { name: 'สำนักทะเบียน', bg: 'bg-violet-100 text-violet-800 border-violet-200' }
        ];

        async function init() {
            const { data, error } = await _supabase.from('complaints').select('*').order('created_at', { ascending: false });
            if (error) return alert("โหลดข้อมูลพลาด: " + error.message);
            allData = data;
            renderList(allData);
        }

        function filterComplaints(type) {
            // เปลี่ยนสีปุ่ม
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => btn.className = "px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 transition");
            document.getElementById(`btn-${type}`).className = "px-4 py-2 text-sm font-medium rounded-lg bg-slate-800 text-white transition";

            let filtered = allData;
            if (type === 'tagged') filtered = allData.filter(item => item.department_tags && item.department_tags.trim() !== "");
            if (type === 'untagged') filtered = allData.filter(item => !item.department_tags || item.department_tags.trim() === "");
            renderList(filtered);
        }

        function renderList(data) {
            const container = document.getElementById('complaintsList');
            if (data.length === 0) return container.innerHTML = '<div class="text-center py-10 text-slate-400">ไม่พบรายการคำร้อง</div>';
            
            container.innerHTML = data.map(item => {
                const tags = item.department_tags ? item.department_tags.split(',').map(t => t.trim()).filter(t => t) : [];
                const tagsHtml = tags.length > 0 ? tags.map(tagName => {
                    const dept = DEPARTMENTS.find(d => d.name === tagName);
                    return `<span class="px-2.5 py-1 text-[10px] font-semibold rounded-lg border ${dept ? dept.bg : 'bg-slate-100'}">📌 ${tagName}</span>`;
                }).join('') : '<span class="text-xs text-red-400 italic font-medium">⚠️ ยังไม่ได้ระบุหน่วยงาน</span>';

                return `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-blue-200 transition">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-800">${item.title}</h3>
                            <button onclick='openTagModal("${item.id}", ${JSON.stringify(tags)})' class="text-blue-600 hover:text-blue-800 text-xs font-semibold px-3 py-1 bg-blue-50 rounded-lg">แก้ไข Tag</button>
                        </div>
                        <div class="mt-3 flex flex-wrap gap-1.5">${tagsHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function openTagModal(id, currentTags) {
            document.getElementById('currentComplaintId').value = id;
            const container = document.getElementById('departmentCheckboxContainer');
            container.innerHTML = DEPARTMENTS.map(dept => `
                <label class="flex items-center gap-2 text-xs p-2 bg-slate-50 rounded-lg cursor-pointer">
                    <input type="checkbox" name="deptTag" value="${dept.name}" ${currentTags.includes(dept.name) ? 'checked' : ''} class="accent-blue-600">
                    ${dept.name}
                </label>
            `).join('');
            document.getElementById('tagModal').classList.remove('hidden');
        }

        function closeTagModal() { document.getElementById('tagModal').classList.add('hidden'); }

        async function saveTags() {
            const id = document.getElementById('currentComplaintId').value;
            const selected = Array.from(document.querySelectorAll('input[name="deptTag"]:checked')).map(cb => cb.value).join(', ');
            const { error } = await _supabase.from('complaints').update({ department_tags: selected }).eq('id', id);
            if (error) return alert("บันทึกพลาด: " + error.message);
            alert("บันทึกสำเร็จ!");
            closeTagModal();
            init(); // โหลดข้อมูลใหม่
        }

        init();
    </script>
</body>
</html>
