<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจ่ายงานและติด Tag กอง/ฝ่าย - เทศบาลเมืองวารินชำราบ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- แผง Sidebar ด้านซ้าย -->
    <div class="w-96 bg-white shadow-xl z-10 flex flex-col h-full shrink-0">
        <!-- ส่วนหัวข้อ -->
        <div class="p-4 bg-slate-800 text-white flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold">🏷️ ระบบจ่ายงานและติด Tag</h1>
                <p class="text-[11px] text-slate-300">เทศบาลเมืองวารินชำราบ</p>
            </div>
            <a href="admin-menu.html" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1.5 rounded-lg font-medium transition text-white">
                &larr; เมนูหลัก
            </a>
        </div>

        <!-- แถบกรองข้อมูลสถานะ Tag -->
        <div class="p-3 bg-slate-50 border-b border-slate-200 flex gap-1.5 justify-between">
            <button onclick="filterComplaints('all')" id="btn-all" class="flex-1 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-white transition shadow-sm">ทั้งหมด</button>
            <button onclick="filterComplaints('tagged')" id="btn-tagged" class="flex-1 py-1.5 text-xs font-medium rounded-lg text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 transition">ติด Tag แล้ว</button>
            <button onclick="filterComplaints('untagged')" id="btn-untagged" class="flex-1 py-1.5 text-xs font-medium rounded-lg text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 transition">ยังไม่ติด Tag</button>
        </div>

        <!-- รายการคำร้อง -->
        <div id="complaintsList" class="flex-1 overflow-y-auto p-3.5 space-y-3">
            <p class="text-xs text-slate-400 text-center py-6">กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <!-- ส่วนแสดงแผนที่ด้านขวา -->
    <div class="flex-1 h-full relative">
        <div id="map"></div>
    </div>

    <!-- Modal สำหรับเลือก Tag (ปรับ z-index เป็น z-[9999] ให้ลอยอยู่บนสุดเสมอ) -->
    <div id="tagModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-slate-800">🏷️ เลือกกอง/ฝ่ายที่รับผิดชอบ</h3>
            <p class="text-xs text-slate-500">ตรวจสอบตำแหน่งจากแผนที่แล้วเลือกหน่วยงานที่เกี่ยวข้อง (สามารถเลือกได้มากกว่า 1)</p>
            
            <input type="hidden" id="currentComplaintId">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-60 overflow-y-auto p-1" id="departmentCheckboxContainer"></div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button onclick="closeTagModal()" class="px-4 py-2 text-xs font-medium bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl transition">ยกเลิก</button>
                <button onclick="saveTags()" class="px-4 py-2 text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition shadow-sm">บันทึก Tag</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://idgojpyhowjjphhanljt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3gL-lEkHS1u6j34kL8nufQ_gHl8YFs2';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let allData = []; 
        let currentFilter = 'all';

        const map = L.map('map').setView([15.1934, 104.8715], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markersLayer = L.layerGroup().addTo(map);

        const DEPARTMENTS = [
            { name: 'สำนักปลัดเทศบาล', bg: 'bg-blue-100 text-blue-800 border-blue-200' },
            { name: 'กองคลัง', bg: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
            { name: 'กองยุทธศาสตร์ฯ', bg: 'bg-purple-100 text-purple-800 border-purple-200' },
            { name: 'กองสาธารณสุขฯ', bg: 'bg-amber-100 text-amber-800 border-amber-200' },
            { name: 'กองสวัสดิการสังคม', bg: 'bg-pink-100 text-pink-800 border-pink-200' },
            { name: 'กองการเจ้าหน้าที่', bg: 'bg-indigo-100 text-indigo-800 border-indigo-200' },
            { name: 'กองช่าง', bg: 'bg-orange-100 text-orange-800 border-orange-200' },
            { name: 'กองช่างสุขา', bg: 'bg-cyan-100 text-cyan-800 border-cyan-200' },
            { name: 'กองการศึกษา', bg: 'bg-rose-100 text-rose-800 border-rose-200' },
            { name: 'กลุ่มงานป้องกันฯ', bg: 'bg-red-100 text-red-800 border-red-200' },
            { name: 'งานนิติการ', bg: 'bg-teal-100 text-teal-800 border-teal-200' },
            { name: 'สำนักทะเบียน', bg: 'bg-violet-100 text-violet-800 border-violet-200' },
            { name: 'พื้นที่นอกเขตรับผิดชอบ', bg: 'bg-slate-200 text-slate-800 border-slate-300' }
        ];

        async function init() {
            const { data, error } = await _supabase.from('complaints').select('*').order('created_at', { ascending: false });
            if (error) return alert("โหลดข้อมูลพลาด: " + error.message);
            allData = data || [];
            applyFilter();
        }

        function filterComplaints(type) {
            currentFilter = type;
            ['all', 'tagged', 'untagged'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === type) {
                    btn.className = "flex-1 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-white transition shadow-sm";
                } else {
                    btn.className = "flex-1 py-1.5 text-xs font-medium rounded-lg text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 transition";
                }
            });
            applyFilter();
        }

        function applyFilter() {
            let filtered = allData;
            if (currentFilter === 'tagged') filtered = allData.filter(item => item.department_tags && item.department_tags.trim() !== "");
            if (currentFilter === 'untagged') filtered = allData.filter(item => !item.department_tags || item.department_tags.trim() === "");
            renderListAndMap(filtered);
        }

        function renderListAndMap(data) {
            const container = document.getElementById('complaintsList');
            container.innerHTML = '';
            markersLayer.clearLayers();

            if (data.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs">ไม่พบรายการคำร้อง</div>';
                return;
            }
            
            data.forEach(item => {
                const tags = item.department_tags ? item.department_tags.split(',').map(t => t.trim()).filter(t => t) : [];
                const tagsHtml = tags.length > 0 ? tags.map(tagName => {
                    const dept = DEPARTMENTS.find(d => d.name === tagName);
                    return `<span class="px-2 py-0.5 text-[9px] font-semibold rounded border ${dept ? dept.bg : 'bg-slate-100'}">📌 ${tagName}</span>`;
                }).join('') : '<span class="text-[10px] text-red-500 font-bold bg-red-50 px-1.5 py-0.5 rounded">⚠️ ยังไม่ได้ระบุหน่วยงาน</span>';

                let marker = null;
                if (item.latitude && item.longitude) {
                    marker = L.marker([item.latitude, item.longitude]);
                    const popupContent = `
                        <div class="p-2 max-w-[220px]">
                            <div class="flex gap-1 mb-1 flex-wrap">${tagsHtml}</div>
                            <h3 class="font-bold text-xs text-slate-800">${item.title}</h3>
                            <p class="text-[11px] text-slate-600 mt-1">${item.description || '-'}</p>
                            <div class="mt-2 pt-2 border-t text-[10px] text-slate-500">
                                แจ้งเมื่อ: ${new Date(item.created_at).toLocaleString('th-TH')}
                            </div>
                            <button onclick='openTagModal("${item.id}", ${JSON.stringify(tags)})' class="mt-2 w-full bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-medium py-1 px-2 rounded transition shadow-sm">
                                ⚙️ จัดการ Tag
                            </button>
                        </div>
                    `;
                    marker.bindPopup(popupContent);
                    markersLayer.addLayer(marker);
                }

                const card = document.createElement('div');
                card.className = 'p-3 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-blue-300 transition cursor-pointer space-y-2';
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-1">
                        <span class="px-2 py-0.5 text-[10px] font-semibold bg-slate-100 text-slate-600 rounded-full">${item.category || 'ทั่วไป'}</span>
                        <button onclick='event.stopPropagation(); openTagModal("${item.id}", ${JSON.stringify(tags)})' class="text-blue-600 hover:text-blue-800 text-[11px] font-semibold px-2 py-0.5 bg-blue-50 rounded-lg">⚙️ แก้ไข Tag</button>
                    </div>
                    <h4 class="font-bold text-xs text-slate-800">${item.title}</h4>
                    <p class="text-[11px] text-slate-500 line-clamp-1">${item.description || '-'}</p>
                    <div class="flex flex-wrap gap-1 pt-1">${tagsHtml}</div>
                `;

                card.addEventListener('click', () => {
                    if (item.latitude && item.longitude && marker) {
                        map.setView([item.latitude, item.longitude], 16);
                        marker.openPopup();
                    } else {
                        alert('เคสนี้ไม่มีพิกัดตำแหน่งบนแผนที่');
                    }
                });

                container.appendChild(card);
            });
        }

        function openTagModal(id, currentTags) {
            document.getElementById('currentComplaintId').value = id;
            const container = document.getElementById('departmentCheckboxContainer');
            container.innerHTML = DEPARTMENTS.map(dept => `
                <label class="flex items-center gap-2 text-xs p-2 bg-slate-50 rounded-lg cursor-pointer hover:bg-slate-100 transition">
                    <input type="checkbox" name="deptTag" value="${dept.name}" ${currentTags.includes(dept.name) ? 'checked' : ''} class="accent-blue-600 w-4 h-4">
                    <span class="${dept.bg} px-2 py-0.5 rounded font-medium">${dept.name}</span>
                </label>
            `).join('');
            document.getElementById('tagModal').classList.remove('hidden');
        }

        function closeTagModal() { document.getElementById('tagModal').classList.add('hidden'); }

        async function saveTags() {
            const id = document.getElementById('currentComplaintId').value;
            const selected = Array.from(document.querySelectorAll('input[name="deptTag"]:checked')).map(cb => cb.value).join(', ');
            const { error } = await _supabase.from('complaints').update({ department_tags: selected }).eq('id', id);
            if (error) return alert("บันทึกพลาด: " + error.message);
            alert("บันทึก Tag สำเร็จ!");
            closeTagModal();
            init(); 
        }

        init();
    </script>
</body>
</html>
