<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - จัดการเรื่องร้องเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">🛠️ แผงควบคุมเจ้าหน้าที่ (Admin Panel)</h1>
                <p class="text-sm text-slate-500">จัดการและปิดงานเรื่องร้องเรียนที่ค้างอยู่</p>
            </div>
            <div class="space-x-2">
                <a href="dashboard.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">Dashboard</a>
                <a href="resolved-dashboard.html" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-emerald-700">ผลงานที่เสร็จแล้ว</a>
            </div>
        </div>

        <!-- แถบกรองข้อมูลตาม Tag ที่ครบถ้วน 12 หน่วยงาน -->
        <div class="mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <label class="block text-sm font-medium text-slate-700 mb-2">กรองตามหน่วยงานรับผิดชอบ:</label>
            <select id="tagFilter" onchange="filterByTag()" class="w-full md:w-72 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="all">ทั้งหมด</option>
                <option value="untagged">ยังไม่ได้ติด Tag (รอจ่ายงาน)</option>
                <optgroup label="รายชื่อกอง/ฝ่ายทั้งหมด">
                    <option value="สำนักปลัดเทศบาล">สำนักปลัดเทศบาล</option>
                    <option value="กองคลัง">กองคลัง</option>
                    <option value="กองยุทธศาสตร์ฯ">กองยุทธศาสตร์ฯ</option>
                    <option value="กองสาธารณสุขฯ">กองสาธารณสุขฯ</option>
                    <option value="กองสวัสดิการสังคม">กองสวัสดิการสังคม</option>
                    <option value="กองการเจ้าหน้าที่">กองการเจ้าหน้าที่</option>
                    <option value="กองช่าง">กองช่าง</option>
                    <option value="กองช่างสุขา">กองช่างสุขา</option>
                    <option value="กองการศึกษา">กองการศึกษา</option>
                    <option value="กลุ่มงานป้องกันฯ">กลุ่มงานป้องกันฯ</option>
                    <option value="งานนิตการ">งานนิตการ</option>
                    <option value="สำนักทะเบียน">สำนักทะเบียน</option>
                </optgroup>
            </select>
        </div>

        <div id="pendingList" class="space-y-4">
            <p class="text-center text-slate-400 py-10">กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <!-- Modal ปิดงาน -->
    <div id="resolveModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">📝 บันทึกผลการดำเนินงานแก้ไข</h3>
            <input type="hidden" id="currentComplaintId">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">รายละเอียดการแก้ไข / สรุปผล *</label>
                    <textarea id="resolutionNote" rows="3" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="เช่น ดำเนินการซ่อมแซมเรียบร้อยแล้ว"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">แนบรูปภาพหลังแก้ไขเสร็จ</label>
                    <input type="file" id="resolutionImage" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm">ยกเลิก</button>
                <button onclick="submitResolution()" id="submitResolveBtn" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium">ยืนยันการปิดงาน</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://idgojpyhowjjphhanljt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3gL-lEkHS1u6j34kL8nufQ_gHl8YFs2';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let allData = [];

        async function fetchComplaints() {
            const { data, error } = await _supabase.from('complaints').select('*').eq('status', 'pending').order('created_at', { ascending: false });
            if (error) return;
            allData = data;
            renderList(allData);
        }

        function renderList(data) {
            const listContainer = document.getElementById('pendingList');
            if (!data.length) {
                listContainer.innerHTML = '<p class="text-center text-slate-400 py-10 bg-white rounded-xl shadow-sm">ไม่พบเรื่องร้องเรียนตามเงื่อนไขนี้</p>';
                return;
            }

            listContainer.innerHTML = data.map(item => {
                const tags = item.department_tags ? item.department_tags.split(',').map(t => t.trim()) : [];
                const tagsHtml = tags.length > 0 
                    ? tags.map(t => `<span class="px-2 py-1 text-[10px] font-bold bg-blue-100 text-blue-700 rounded-md border border-blue-200">📌 ${t}</span>`).join(' ')
                    : '<span class="text-[10px] text-red-500 font-bold bg-red-50 px-2 py-1 rounded-md">⚠️ ยังไม่ได้ระบุหน่วยงาน</span>';

                return `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="space-y-1">
                            <div class="flex gap-2 items-center flex-wrap">
                                <span class="px-2.5 py-0.5 text-xs font-semibold bg-amber-100 text-amber-800 rounded-full">${item.category || 'ทั่วไป'}</span>
                                ${tagsHtml}
                            </div>
                            <h3 class="font-bold text-slate-800 text-lg">${item.title}</h3>
                            <p class="text-xs text-slate-400">ผู้แจ้ง: ${item.reporter_name || 'ไม่ระบุ'} | แจ้งเมื่อ: ${new Date(item.created_at).toLocaleString('th-TH')}</p>
                        </div>
                        <button onclick="openModal('${item.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition shadow-sm whitespace-nowrap">
                            ✅ ดำเนินการเสร็จสิ้น
                        </button>
                    </div>
                `;
            }).join('');
        }

        function filterByTag() {
            const filterValue = document.getElementById('tagFilter').value;
            if (filterValue === 'all') return renderList(allData);
            if (filterValue === 'untagged') return renderList(allData.filter(i => !i.department_tags || i.department_tags.trim() === ""));
            renderList(allData.filter(i => i.department_tags && i.department_tags.includes(filterValue)));
        }

        function openModal(id) {
            document.getElementById('currentComplaintId').value = id;
            document.getElementById('resolveModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('resolveModal').classList.add('hidden'); }

        async function submitResolution() {
            const id = document.getElementById('currentComplaintId').value;
            const note = document.getElementById('resolutionNote').value;
            if (!note) return alert('กรุณากรอกรายละเอียดการแก้ไข');
            
            const { error } = await _supabase.from('complaints').update({ status: 'resolved', resolution_note: note, resolved_at: new Date().toISOString() }).eq('id', id);
            if (error) return alert("บันทึกพลาด: " + error.message);
            alert('ปิดงานเรียบร้อย');
            closeModal();
            fetchComplaints();
        }

        fetchComplaints();
    </script>
</body>
</html>
