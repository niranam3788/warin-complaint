<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard แผนที่เรื่องร้องเรียน - วารินชำราบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <div class="w-1/3 bg-white shadow-xl z-10 flex flex-col h-full">
        <div class="p-4 bg-slate-800 text-white flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold">📊 ติดตามเรื่องร้องเรียน</h1>
                <p class="text-xs text-slate-300">เทศบาลเมืองวารินชำราบ</p>
            </div>
            <a href="admin-panel.html" class="bg-emerald-600 hover:bg-emerald-700 text-xs px-2.5 py-1.5 rounded-lg font-medium transition">จัดการเคส</a>
        </div>
        <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
            <span class="text-sm font-medium text-slate-700">เคสที่กำลังดำเนินการ (Pending)</span>
            <a href="resolved-dashboard.html" class="text-xs text-blue-600 hover:underline">ดูประวัติ &rarr;</a>
        </div>
        <div id="complaintList" class="flex-1 overflow-y-auto p-4 space-y-3">
            <p class="text-sm text-slate-400 text-center py-4">กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <div class="w-2/3 h-full relative">
        <div id="map"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const SUPABASE_URL = 'https://idgojpyhowjjphhanljt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3gL-lEkHS1u6j34kL8nufQ_gHl8YFs2';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const map = L.map('map').setView([15.1934, 104.8715], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        async function loadComplaints() {
            const { data, error } = await _supabase
                .from('complaints')
                .select('*')
                .eq('status', 'pending')
                .order('created_at', { ascending: false });

            if (error) return;
            const listContainer = document.getElementById('complaintList');
            listContainer.innerHTML = '';

            if (!data.length) {
                listContainer.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">ไม่มีเรื่องร้องเรียนที่ค้างอยู่</p>';
                return;
            }

            const now = new Date();

            data.forEach((item) => {
                if (item.latitude && item.longitude) {
                    const createdAt = new Date(item.created_at);
                    const totalHours = Math.floor((now - createdAt) / (1000 * 60 * 60));
                    const daysPassed = Math.floor(totalHours / 24);
                    const textTime = totalHours < 24 ? (totalHours === 0 ? 'เพิ่งแจ้ง' : `${totalHours} ชม.`) : `${daysPassed} วัน`;
                    
                    let badgeColor = 'bg-emerald-100 text-emerald-800';
                    if (daysPassed > 7) badgeColor = 'bg-red-100 text-red-800 font-bold';
                    else if (daysPassed > 3) badgeColor = 'bg-amber-100 text-amber-800';

                    // จัดการ Tag
                    const tags = item.department_tags ? item.department_tags.split(',').map(t => t.trim()) : [];
                    const tagsHtml = tags.map(t => `<span class="px-1.5 py-0.5 text-[9px] font-bold bg-blue-100 text-blue-700 rounded border border-blue-200">📌 ${t}</span>`).join(' ');

                    const marker = L.marker([item.latitude, item.longitude]).addTo(map);

                    const popupContent = `
                        <div class="p-2 max-w-[200px]">
                            <div class="flex gap-1 mb-1 flex-wrap">${tagsHtml}</div>
                            <h3 class="font-bold text-sm text-slate-800">${item.title}</h3>
                            <p class="text-xs text-slate-600 mt-1">${item.description || '-'}</p>
                            <div class="mt-2 pt-2 border-t text-[10px] text-slate-500">
                                ผู้แจ้ง: ${item.reporter_name || 'ไม่ระบุ'}<br>
                                แจ้งเมื่อ: ${new Date(item.created_at).toLocaleString('th-TH')}
                            </div>
                        </div>
                    `;
                    marker.bindPopup(popupContent);

                    const card = document.createElement('div');
                    card.className = 'p-3 bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md transition cursor-pointer';
                    card.innerHTML = `
                        <div class="flex justify-between items-start gap-1">
                            <span class="px-2 py-0.5 text-[10px] font-semibold bg-slate-100 text-slate-600 rounded-full">${item.category || 'ทั่วไป'}</span>
                            <span class="px-2 py-0.5 text-[10px] font-semibold ${badgeColor} rounded-full">${textTime}</span>
                        </div>
                        <h4 class="font-semibold text-sm text-slate-800 mt-1">${item.title}</h4>
                        <div class="flex flex-wrap gap-1 mt-2">${tagsHtml || '<span class="text-[9px] text-red-400 italic">⚠️ รอจ่ายงาน</span>'}</div>
                    `;

                    card.addEventListener('click', () => {
                        map.setView([item.latitude, item.longitude], 16);
                        marker.openPopup();
                    });

                    listContainer.appendChild(card);
                }
            });
        }

        loadComplaints();
    </script>
</body>
</html>
