<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard แผนที่เรื่องร้องเรียน - วารินชำราบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- แผง Sidebar ด้านซ้าย (ขยายความกว้างเป็น w-96) -->
    <div class="w-96 bg-white shadow-xl z-10 flex flex-col h-full shrink-0">
        <!-- ส่วนหัวและลิงก์เมนู -->
        <div class="p-4 bg-slate-800 text-white flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold">📊 ติดตามเรื่องร้องเรียน</h1>
                <p class="text-[11px] text-slate-300">เทศบาลเมืองวารินชำราบ</p>
            </div>
            <a href="admin-panel.html" class="bg-emerald-600 hover:bg-emerald-700 text-xs px-2.5 py-1.5 rounded-lg font-medium transition">จัดการเคส</a>
        </div>

        <!-- กล่องตัวเลขแสดงจำนวนเคสที่กำลังดำเนินการ -->
        <div class="p-3.5 bg-blue-600 text-white flex justify-between items-center shadow-sm">
            <div>
                <p class="text-xs text-blue-100 font-medium">เคสที่กำลังดำเนินการทั้งหมด</p>
                <h2 id="totalPendingCount" class="text-2xl font-extrabold mt-0.5">0</h2>
            </div>
            <div class="bg-blue-500/50 px-2.5 py-1.5 rounded-lg border border-blue-400/30 text-center">
                <span class="text-[9px] block text-blue-100">สถานะ</span>
                <span class="text-xs font-bold text-white">Pending</span>
            </div>
        </div>

        <!-- แถบกรองข้อมูลตาม Tag -->
        <div class="p-3 bg-slate-50 border-b border-slate-200">
            <label class="block text-xs font-semibold text-slate-600 mb-1">🔍 กอง/ฝ่ายที่รับผิดชอบ:</label>
            <select id="dashboardTagFilter" onchange="filterDashboard()" class="w-full px-3 py-2 text-xs border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium">
                <option value="all">ทั้งหมดทุกหน่วยงาน</option>
                <option value="untagged">⚠️ ยังไม่ได้ติด Tag (รอจ่ายงาน)</option>
                <optgroup label="รายชื่อกอง/ฝ่าย">
                    <option value="สำนักปลัดเทศบาล">สำนักปลัดเทศบาล</option>
                    <option value="กองคลัง">กองคลัง</option>
                    <option value="กองยุทธศาสตร์ฯ">กองยุทธศาสตร์ฯ</option>
                    <option value="กองสาธารณสุขฯ">กองสาธารณสุขฯ</option>
                    <option value="กองสวัสดิการสังคม">กองสวัสดิการสังคม</option>
                    <option value="กองการเจ้าหน้าที่">กองการเจ้าหน้าที่</option>
                    <option value="กองช่าง">กองช่าง</option>
                    <option value="กองช่างสุขา">กองช่างสุขา</option>
                    <option value="กองการศึกษา">กองการศึกษา</option>
                    <option value="กลุ่มงานป้องกันฯ">กลุ่มงานป้องกันฯ</option>
                    <option value="งานนิติการ">งานนิติการ</option>
                    <option value="สำนักทะเบียน">สำนักทะเบียน</option>
                    <option value="พื้นที่นอกเขตรับผิดชอบ">พื้นที่นอกเขตรับผิดชอบ</option>
                </optgroup>
            </select>
        </div>

        <!-- ลิงก์ไปหน้าประวัติ -->
        <div class="px-3.5 py-2 bg-slate-100 border-b border-slate-200 flex justify-between items-center text-xs">
            <span class="text-slate-500 font-medium">รายการเรื่องร้องเรียน</span>
            <a href="resolved-dashboard.html" class="text-blue-600 hover:underline font-medium">ดูประวัติงานที่เสร็จแล้ว &rarr;</a>
        </div>

        <!-- รายการการ์ดคำร้อง -->
        <div id="complaintList" class="flex-1 overflow-y-auto p-3.5 space-y-3">
            <p class="text-xs text-slate-400 text-center py-4">กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <!-- ส่วนแสดงแผนที่ -->
    <div class="flex-1 h-full relative">
        <div id="map"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const SUPABASE_URL = 'https://idgojpyhowjjphhanljt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3gL-lEkHS1u6j34kL8nufQ_gHl8YFs2';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const map = L.map('map').setView([15.1934, 104.8715], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markersLayer = L.layerGroup().addTo(map);
        let allData = [];

        async function loadComplaints() {
            const { data, error } = await _supabase
                .from('complaints')
                .select('*')
                .eq('status', 'pending')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            allData = data || [];
            renderDashboard(allData);
        }

        function filterDashboard() {
            const filterValue = document.getElementById('dashboardTagFilter').value;
            let filtered = allData;

            if (filterValue === 'untagged') {
                filtered = allData.filter(i => !i.department_tags || i.department_tags.trim() === "");
            } else if (filterValue !== 'all') {
                filtered = allData.filter(i => i.department_tags && i.department_tags.includes(filterValue));
            }

            renderDashboard(filtered);
        }

        function renderDashboard(data) {
            document.getElementById('totalPendingCount').textContent = data.length;

            const listContainer = document.getElementById('complaintList');
            listContainer.innerHTML = '';
            markersLayer.clearLayers();

            if (!data.length) {
                listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">ไม่พบเรื่องร้องเรียนตามเงื่อนไข</p>';
                return;
            }

            const now = new Date();

            data.forEach((item) => {
                if (item.latitude && item.longitude) {
                    const createdAt = new Date(item.created_at);
                    const totalHours = Math.floor((now - createdAt) / (1000 * 60 * 60));
                    const daysPassed = Math.floor(totalHours / 24);
                    const textTime = totalHours < 24 ? (totalHours === 0 ? 'เพิ่งแจ้ง' : `${totalHours} ชม.`) : `${daysPassed} วัน`;
                    
                    let badgeColor = 'bg-emerald-100 text-emerald-800';
                    if (daysPassed > 7) badgeColor = 'bg-red-100 text-red-800 font-bold';
                    else if (daysPassed > 3) badgeColor = 'bg-amber-100 text-amber-800';

                    const tags = item.department_tags ? item.department_tags.split(',').map(t => t.trim()).filter(t => t) : [];
                    const tagsHtml = tags.map(t => `<span class="px-1.5 py-0.5 text-[10px] font-bold bg-blue-100 text-blue-700 rounded border border-blue-200">📌 ${t}</span>`).join(' ');

                    const marker = L.marker([item.latitude, item.longitude]);

                    const popupContent = `
                        <div class="p-2 max-w-[200px]">
                            <div class="flex gap-1 mb-1 flex-wrap">${tagsHtml}</div>
                            <h3 class="font-bold text-sm text-slate-800">${item.title}</h3>
                            <p class="text-xs text-slate-600 mt-1">${item.description || '-'}</p>
                            <div class="mt-2 pt-2 border-t text-[10px] text-slate-500">
                                ผู้แจ้ง: ${item.reporter_name || 'ไม่ระบุ'}<br>
                                แจ้งเมื่อ: ${new Date(item.created_at).toLocaleString('th-TH')}
                            </div>
                        </div>
                    `;
                    marker.bindPopup(popupContent);
                    markersLayer.addLayer(marker);

                    const card = document.createElement('div');
                    card.className = 'p-3 bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md transition cursor-pointer';
                    card.innerHTML = `
                        <div class="flex justify-between items-start gap-1">
                            <span class="px-2 py-0.5 text-[10px] font-semibold bg-slate-100 text-slate-600 rounded-full">${item.category || 'ทั่วไป'}</span>
                            <span class="px-2 py-0.5 text-[10px] font-semibold ${badgeColor} rounded-full">${textTime}</span>
                        </div>
                        <h4 class="font-semibold text-xs text-slate-800 mt-1.5">${item.title}</h4>
                        <div class="flex flex-wrap gap-1 mt-2">${tagsHtml || '<span class="text-[10px] text-red-500 font-bold bg-red-50 px-1.5 py-0.5 rounded">⚠️ รอจ่ายงาน</span>'}</div>
                    `;

                    card.addEventListener('click', () => {
                        map.setView([item.latitude, item.longitude], 16);
                        marker.openPopup();
                    });

                    listContainer.appendChild(card);
                }
            });
        }

        loadComplaints();
    </script>
</body>
</html>
