<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามสถานะคำร้อง - เทศบาลเมืองวารินชำราบ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-2xl mx-auto">
        <!-- ส่วนหัวข้อ -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">🔍 ระบบติดตามสถานะคำร้อง</h1>
            <p class="text-sm text-slate-500 mt-1">เทศบาลเมืองวารินชำราบ จังหวัดอุบลราชธานี</p>
        </div>
        
        <!-- ช่องกรอกเบอร์โทรศัพท์สำหรับค้นหา -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <label class="block text-sm font-semibold text-slate-700 mb-2">กรอกเบอร์โทรศัพท์มือถือที่ใช้ในการแจ้งเรื่อง</label>
            <div class="flex gap-2">
                <input type="text" id="phoneInput" placeholder="เช่น 0812345678" class="flex-1 px-4 py-2.5 text-sm border rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="trackComplaint()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-6 py-2.5 rounded-xl transition shadow-sm">
                    🔍 ค้นหา
                </button>
            </div>
            <p class="text-xs text-slate-400 mt-2">*ระบบจะแสดงรายการเรื่องร้องเรียนทั้งหมดที่ตรงกับเบอร์โทรศัพท์ดังกล่าว</p>
        </div>

        <!-- พื้นที่แสดงผลรายการคำร้อง -->
        <div id="resultArea" class="space-y-4">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-400 text-sm">
                กรุณากรอกเบอร์โทรศัพท์เพื่อตรวจสอบสถานะคำร้องของคุณ
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://idgojpyhowjjphhanljt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3gL-lEkHS1u6j34kL8nufQ_gHl8YFs2';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ฟังก์ชันแปลงรูปแบบวันที่ให้เป็นไทย
        function formatDateOnly(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('th-TH', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // ฟังก์ชันค้นหาคำร้องตามเบอร์โทรศัพท์ (reporter_phone)
        async function trackComplaint() {
            const phone = document.getElementById('phoneInput').value.trim();
            const resultArea = document.getElementById('resultArea');

            if (!phone) {
                alert('กรุณากรอกเบอร์โทรศัพท์ก่อนทำการค้นหา');
                return;
            }

            resultArea.innerHTML = '<p class="text-center text-slate-400 py-6">กำลังค้นหาข้อมูล...</p>';

            const { data, error } = await _supabase
                .from('complaints')
                .select('*')
                .eq('reporter_phone', phone)
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                resultArea.innerHTML = '<p class="text-center text-red-500 py-6">เกิดข้อผิดพลาดในการดึงข้อมูล กรุณาลองใหม่อีกครั้ง</p>';
                return;
            }

            if (!data || data.length === 0) {
                resultArea.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center space-y-2">
                        <p class="text-slate-600 font-medium">ไม่พบข้อมูลการร้องเรียนจากเบอร์โทรศัพท์นี้</p>
                        <p class="text-xs text-slate-400">โปรดตรวจสอบความถูกต้องของเบอร์โทรศัพท์ที่ใช้แจ้งเรื่องอีกครั้ง</p>
                    </div>
                `;
                return;
            }

            // แสดงรายการที่ค้นพบทั้งหมด
            resultArea.innerHTML = data.map(item => {
                const isResolved = item.status === 'resolved';
                const statusBadge = isResolved 
                    ? '<span class="px-3 py-1 text-xs font-semibold bg-emerald-100 text-emerald-800 rounded-full">✅ ดำเนินการแล้วเสร็จ</span>'
                    : '<span class="px-3 py-1 text-xs font-semibold bg-amber-100 text-amber-800 rounded-full">⏳ อยู่ระหว่างการดำเนินงาน</span>';

                return `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 pb-3 border-b border-slate-100">
                            <div>
                                <span class="text-xs text-slate-400">วันที่แจ้งเรื่อง: ${formatDateOnly(item.created_at)}</span>
                                <p class="text-xs text-slate-500 mt-0.5">หมวดหมู่: ${item.category || '-'}</p>
                            </div>
                            <div>${statusBadge}</div>
                        </div>

                        <div>
                            <h3 class="font-bold text-slate-800 text-base">${item.title}</h3>
                            <p class="text-xs text-slate-600 mt-1 leading-relaxed">รายละเอียด: ${item.description || '-'}</p>
                            <p class="text-xs text-slate-400 mt-2">📍 พิกัด: ${item.latitude || '-'}, ${item.longitude || '-'}</p>
                        </div>

                        <!-- ส่วนแสดงผลการดำเนินงาน (กรณีที่ปิดงานแล้ว) -->
                        ${isResolved ? `
                            <div class="p-4 bg-emerald-50 rounded-xl border border-emerald-100 space-y-1">
                                <p class="text-xs font-bold text-emerald-800">📌 ผลการจัดการ (ปิดงานเมื่อ ${formatDateOnly(item.resolved_at)}):</p>
                                <p class="text-xs text-emerald-700 leading-relaxed">${item.resolution_note || 'ไม่มีบันทึกรายละเอียดเพิ่มเติม'}</p>
                            </div>
                        ` : ''}

                        <!-- รูปภาพประกอบ (ถ้ามี) -->
                        <div class="grid grid-cols-2 gap-3 pt-2">
                            <div>
                                <p class="text-[10px] text-slate-400 mb-1">รูปภาพตอนแจ้งเรื่อง</p>
                                ${item.image_url ? `<img src="${item.image_url}" class="w-full h-32 object-cover rounded-xl border">` : '<div class="w-full h-32 bg-slate-50 rounded-xl border flex items-center justify-center text-xs text-slate-400">ไม่มีรูปภาพ</div>'}
                            </div>
                            <div>
                                <p class="text-[10px] text-emerald-600 font-semibold mb-1">รูปภาพหลังซ่อมเสร็จ</p>
                                ${item.resolution_image_url ? `<img src="${item.resolution_image_url}" class="w-full h-32 object-cover rounded-xl border border-emerald-200">` : '<div class="w-full h-32 bg-slate-50 rounded-xl border flex items-center justify-center text-xs text-slate-400">ยังไม่มีรูปภาพ</div>'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
