<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Complaint : ลบเรื่องร้องเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <!-- หัวข้อหน้าจอและปุ่มกลับเมนู -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                🗑️ Remove Complaint : ลบเรื่องร้องเรียน
            </h1>
            <a href="admin-menu.html" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                &larr; เมนูหลัก
            </a>
        </div>
        
        <!-- ตารางจัดการข้อมูล -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-slate-600 uppercase font-semibold text-[10px]">
                    <tr>
                        <th class="px-6 py-4">วันที่แจ้ง</th>
                        <th class="px-6 py-4">เรื่อง</th>
                        <th class="px-6 py-4">สถานะ</th>
                        <th class="px-6 py-4 text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody" class="divide-y divide-slate-100">
                    <!-- ข้อมูลจะถูกโหลดมาแสดงที่นี่ -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://idgojpyhowjjphhanljt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3gL-lEkHS1u6j34kL8nufQ_gHl8YFs2';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ฟังก์ชันลบข้อมูล (มีแจ้งเตือนก่อนลบ)
        async function deleteComplaint(id, title) {
            const isConfirmed = confirm(`⚠️ คำเตือน! คุณแน่ใจหรือไม่ว่าจะลบเรื่องร้องเรียนนี้?\nหัวข้อ: "${title}"\nการกระทำนี้ไม่สามารถย้อนกลับได้`);
            
            if (!isConfirmed) return;

            const { error } = await _supabase
                .from('complaints')
                .delete()
                .eq('id', id);

            if (error) {
                alert('เกิดข้อผิดพลาดในการลบ: ' + error.message);
            } else {
                alert('ลบข้อมูลเรียบร้อยแล้ว');
                loadAdminData(); // โหลดรายการใหม่หลังลบ
            }
        }

        // ฟังก์ชันดึงข้อมูลมาแสดงผล
        async function loadAdminData() {
            const { data, error } = await _supabase
                .from('complaints')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-50">
                    <td class="px-6 py-4 text-xs text-slate-500">${new Date(item.created_at).toLocaleDateString('th-TH')}</td>
                    <td class="px-6 py-4 font-medium text-slate-800">${item.title}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 text-[10px] font-semibold rounded-full ${item.status === 'resolved' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                            ${item.status === 'resolved' ? 'ปิดงานแล้ว' : 'รอดำเนินการ'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="deleteComplaint('${item.id}', '${item.title.replace(/"/g, '\\"')}')" 
                                class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium py-1.5 px-3 rounded-lg transition text-xs">
                            🗑️ ลบ
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // เริ่มโหลดข้อมูลเมื่อเปิดหน้าเว็บ
        loadAdminData();
    </script>
</body>
</html>
